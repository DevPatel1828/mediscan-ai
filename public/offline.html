<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — MediScan AI 2.0</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B132B;
            color: #F8FAFC;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            border-radius: 16px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 1rem;
            color: #F8FAFC;
        }
        p {
            font-size: 0.95rem;
            color: #94A3B8;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .btn {
            background-color: #2563EB;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="/brand_logo.png" alt="MediScan AI Logo">
        <h1>You are Offline</h1>
        <p>MediScan AI 2.0 requires an active internet connection to run prescription scans and process artificial intelligence lookups.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
